[project]
name = "adbreak-backend"
version = "0.1.0"
description = "Cuepoint — context-aware ad-break placement for long-form video"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "anthropic>=1.8.0",
    "pymongo>=4.6",
    "dnspython>=2.6",
    "pyjwt>=2.15.0",
]

[tool.uv]
package = false
