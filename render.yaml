services:
  - type: web
    name: adbreak-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODELS
        value: gemini-3.8-flash,gemini-3.7-flash,gemini-3.5-flash,gemini-3.5-flash-lite
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: cuepoint
      - key: CORS_ORIGINS
        value: "*"
      - key: CREATIVE_BASE_URL
        sync: false
      - key: GEMINI_TEXT_MODELS
        value: gemini-3.1-pro-preview,gemini-3.8-flash,gemini-3.7-flash
      - key: SHOT_DETECT
        value: "0"
      - key: DATA_DIR
        value: /data
